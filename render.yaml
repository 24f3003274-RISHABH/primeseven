# Render Blueprint for PrimePrep CUET PG Platform
# Single free-tier Node Web Service (Express API + compiled React/Vite SPA)
# Connected to external Supabase PostgreSQL database via DATABASE_URL
services:
  - type: web
    name: primeprep-cuetpg
    runtime: node
    plan: free
    region: singapore
    buildCommand: bun install --frozen-lockfile && bun run build
    startCommand: bun run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PGSSLMODE
        value: require
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_NAME
        value: Prime Seven
      - key: ADMIN_EMAIL
        value: primeseven@gmail.com
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: ADMIN_SETUP_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false

